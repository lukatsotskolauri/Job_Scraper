name: Jobs scraper

on:
  schedule:
    - cron: "0 8,16 * * *"   # 08:00 and 16:00 UTC = 12:00 and 20:00 Tbilisi
  workflow_dispatch:       # manual run button

permissions:
  contents: write

# Never run two scrapes at once (e.g. a manual run during a scheduled one),
# so they can't both push seen_jobs.json.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Run scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHAT_CATEGORIES: ${{ secrets.CHAT_CATEGORIES }}
          ALERT_CHAT_ID: ${{ secrets.ALERT_CHAT_ID }}
        run: uv run python jobsge.py

      - name: Save seen jobs
        if: success() || failure()   # keep progress from categories that succeeded
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f seen_jobs.json
          git diff --cached --quiet || git commit -m "Update seen jobs"
          git push